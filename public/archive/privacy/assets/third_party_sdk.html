                </p>
                <p class="${sdkInfo.privacyPolicy ? "" : "hide"}">
                  <span>隐私政策：</span>
                  <a href="${sdkInfo.privacyPolicy}">${
            sdkInfo.privacyPolicy
          }</a>
                </p>
              </div>
            </section>`;
        })
        .join("");
    }

    function main() {
      document.querySelector(".sdk-box-container-three").innerHTML =
        renderToHtml(__SKD_LIST__);
      document.querySelector(".sdk-box-container-app").innerHTML =
        renderToHtmlApp(__APP_SKD_LIST__);
      document.querySelector(".sdk-box-container-other").innerHTML =
        renderToHtmlOther(__OTHER_SKD_LIST__);
    }

    window.onload = main();
  </script>
</html>
